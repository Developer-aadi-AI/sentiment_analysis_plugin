[project]
name = "review-responder"
version = "0.1.0"
description = "Pluggable LangGraph add-on that classifies customer reviews and replies with context-aware emails."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "aiosmtplib>=3.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.0"]
openai = ["langchain-openai>=1.0"]
groq = ["langchain-groq>=1.0"]
google = ["langchain-google-genai>=3.0"]
ollama = ["langchain-ollama>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
review-responder = "review_responder.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["review_responder"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["evals: real-LLM evaluations (opt-in, needs network + API key)"]
addopts = "-m 'not evals'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
